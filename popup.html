<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>User-Agent Local</title></head>
<body class="popup"><main><header><h1>User-Agent <span>Local</span></h1><a href="options.html" target="_blank">Configurações</a></header>
<label for="ua">User-Agent HTTP</label><textarea id="ua" rows="4" spellcheck="false" placeholder="Cole uma identidade HTTP"></textarea>

<div class="actions"><button id="apply" disabled>Aplicar nesta aba</button><button id="restore" class="secondary" disabled>Restaurar</button></div>
<button id="reload" class="secondary" disabled>Recarregar página</button>

</main><script type="module" src="/src/popup.ts"></script></body></html>
