<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>User-Agent Local</title></head>
<body class="popup"><main>
<header class="topbar">
  <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="16"/><path fill-rule="evenodd" d="M4.6 12.6c3.7-2.3 7.6-2 11.4.5 3.8-2.5 7.7-2.8 11.4-.5.7 4.6-1.4 8.5-5.3 8.9-2.4.2-4.3-1.2-6.1-3.3-1.8 2.1-3.7 3.5-6.1 3.3-3.9-.4-6-4.3-5.3-8.9ZM8.6 15.6c1.5-1.2 3.6-1.1 5 .3-1 1.6-3.4 1.8-5-.3Zm14.8 0c-1.5-1.2-3.6-1.1-5 .3 1 1.6 3.4 1.8 5-.3Z"/></svg><h1>User-Agent <span>Local</span></h1></div>
  <div class="top-actions">
  <button id="save-open" type="button" class="icon-button" aria-label="Salvar como perfil" title="Salvar como perfil"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 4h12v16l-6-4-6 4Z"/><path d="M12 7.5v5M9.5 10h5"/></svg></button>
  <a class="icon-button" href="options.html" target="_blank" aria-label="Configurações" title="Configurações"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></a>
  </div>
</header>
<section class="identity" aria-label="Identidade desta aba">
  <div id="applied" tabindex="0" aria-label="Configuração HTTP confirmada"></div>
  <button id="reload" class="ghost" disabled title="Recarregar a página da aba">Recarregar</button>
</section>
<div class="browse">
  <div class="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><label class="visually-hidden" for="search">Encontrar perfil</label><input id="search" type="search" placeholder="Buscar dispositivo, navegador ou sistema" autocomplete="off"></div>
  <div class="browse-scroll">
    <nav id="profiles" aria-label="Perfis"></nav>
    <form id="save-form" hidden>
      <button type="button" class="list-back" id="save-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Salvar como perfil</span></button>
      <div class="save-fields">
        <label for="save-name">Nome</label><input id="save-name" required>
        <label for="save-category">Categoria</label><select id="save-category"><option>Desktop</option><option>Mobile</option><option>Tablet</option><option>Bots</option></select>
        <p>Salva o User-Agent do campo abaixo, sem aplicar ou recarregar.</p>
        <button id="save" type="submit">Salvar perfil</button>
      </div>
    </form>
    <aside class="limits"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3 5 6v5.5c0 4.3 2.9 8 7 9.5 4.1-1.5 7-5.2 7-9.5V6Z"/><path d="M9 12h6"/></svg><p><strong>Somente cabeçalhos HTTP</strong>navigator, tela, touch, motor e IP continuam reais. Um UA de bot não comprova sua autenticidade.</p></aside>
  </div>
</div>
<footer class="action-dock">
  <label class="visually-hidden" for="ua">User-Agent HTTP</label>
  <input id="ua" type="text" spellcheck="false" autocomplete="off" placeholder="Cole um User-Agent">
  <div class="dock-actions">
    <button id="apply" disabled>Aplicar</button>
    <button id="restore" class="secondary" disabled title="Voltar ao User-Agent original do navegador">Restaurar</button>
  </div>
  <p id="status" role="status" aria-live="polite">Consultando aba…</p>
</footer>
</main><script type="module" src="/src/popup.ts"></script></body></html>
